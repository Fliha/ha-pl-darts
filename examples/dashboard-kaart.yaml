# PDC Darts – dashboardkaart (Premier League + WK)
# Dashboard bewerken → Kaart toevoegen → "Handmatig" → plak alles hieronder.
# Gebruikt alleen standaardkaarten, er hoeft niets extra geïnstalleerd te worden.

type: vertical-stack
cards:
  - type: markdown
    title: 🎯 Premier League Darts
    content: >-
      {% set n = states.sensor.pl_darts_next_night %}
      {% set live = states('sensor.pl_darts_live_match') %}
      {% if live not in ['Geen', 'unknown', 'unavailable'] %}
      ### 🔴 Nu live: {{ live }}
      {% endif %}
      {% if n and n.state not in ['unknown', 'unavailable'] %}
      **{{ n.attributes.avond }} – {{ n.attributes.stad }}**
      {{ n.attributes.zaal }}<br>
      {{ as_timestamp(n.state) | timestamp_custom('%d-%m-%Y, %H:%M') }} uur

      {% if n.attributes.indeling_bekend %}
      | Tijd | Ronde | Partij |
      |:--|:--|:--|
      {% for p in n.attributes.partijen -%}
      | {{ as_timestamp(p.start) | timestamp_custom('%H:%M') }} | {{ p.ronde }} | {{ p.speler_1 }} {{ p.stand or '–' }} {{ p.speler_2 }} |
      {% endfor %}
      {% else %}
      _Wie tegen wie speelt wordt een paar dagen vooraf bekend._
      {% endif %}
      {% else %}
      Geen speelavond meer gepland dit seizoen.
      {% endif %}

      **Laatste uitslag:** {{ states('sensor.pl_darts_last_result') }}

      <sub>Bron: {{ state_attr('sensor.pl_darts_next_night', 'bron') or 'alleen schema' }}</sub>

  - type: markdown
    content: >-
      {% set s = states.sensor.pl_darts_standings %}
      {% if s and s.attributes.stand %}
      ### 🏆 Stand {{ s.attributes.seizoen }}{{ ' (eindstand)' if not s.attributes.voorlopig }}
      | # | Speler | Ptn | Avonden | Legs |
      |--:|:--|--:|--:|--:|
      {% for r in s.attributes.stand -%}
      | {{ r.positie }} | {{ r.naam }} | **{{ r.punten }}** | {{ r.avonden_gewonnen }} | {{ '%+d' % r.legsaldo }} |
      {% endfor %}
      {% else %}
      Nog geen stand beschikbaar.
      {% endif %}

  - type: markdown
    content: >-
      {% set w = states.sensor.pl_darts_wk_status %}
      {% set s = states.sensor.pl_darts_wk_next_session %}
      ### 🏆 WK Darts {{ w.attributes.editie if w else '' }}
      **{{ states('sensor.pl_darts_wk_status') }}**<br>
      Alexandra Palace, Londen

      {% if s and s.state not in ['unknown', 'unavailable'] %}
      **Volgende sessie:** {{ as_timestamp(s.state) | timestamp_custom('%d-%m-%Y, %H:%M') }} uur
      {% if s.attributes.programma_bekend %}
      ({{ s.attributes.sessie }}, {{ s.attributes.rondes | join(', ') }})

      | Partij | Stand |
      |:--|:--|
      {% for p in s.attributes.partijen -%}
      | {{ p.speler_1 }} – {{ p.speler_2 }} | {{ p.stand or '–' }} |
      {% endfor %}
      {% else %}
      _Het speelschema volgt eind november, na de loting._
      {% endif %}
      {% endif %}

      **Laatste WK-uitslag:** {{ states('sensor.pl_darts_wk_last_result') }}
      {% if w and w.attributes.vorige_kampioen %}<br>Vorige wereldkampioen: {{ w.attributes.vorige_kampioen }}{% endif %}

  - type: calendar
    entities:
      - calendar.pl_darts_calendar
      - calendar.pl_darts_wk_calendar
    initial_view: listWeek
